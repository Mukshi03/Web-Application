<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Gray Lane 3PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--surface-2:#F9FAFB;--line:#E5E7EB;--line-2:#F0F1F3;
  --fg:#111827;--fg-2:#374151;--muted:#6B7280;--faint:#9CA3AF;
  --accent:#1D5FD1;--accent-ink:#FFFFFF;--accent-soft:#EEF3FD;--accent-2:#F59E0B;
  --good:#047857;--good-soft:#ECFDF5;--warn:#B45309;--warn-soft:#FFFBEB;--bad:#B91C1C;--bad-soft:#FEF2F2;--info:#1D4ED8;--info-soft:#EFF6FF;--vas:#7C3AED;
  --shadow:0 10px 30px rgba(17,24,39,.12);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420;--surface:#151D2B;--surface-2:#1A2333;--line:#273246;--line-2:#1F293A;
  --fg:#E8ECF3;--fg-2:#C6CEDB;--muted:#93A0B5;--faint:#6B7891;
  --accent:#5B8DEF;--accent-ink:#0B1220;--accent-soft:#1B2A47;--accent-2:#F5B042;
  --good:#4ADE9A;--good-soft:#12302A;--warn:#F5B042;--warn-soft:#33270F;--bad:#F87171;--bad-soft:#3A1A1D;--info:#7DA6F5;--info-soft:#18284A;--vas:#B79CF7;
  --shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420;--surface:#151D2B;--surface-2:#1A2333;--line:#273246;--line-2:#1F293A;
  --fg:#E8ECF3;--fg-2:#C6CEDB;--muted:#93A0B5;--faint:#6B7891;
  --accent:#5B8DEF;--accent-ink:#0B1220;--accent-soft:#1B2A47;--accent-2:#F5B042;
  --good:#4ADE9A;--good-soft:#12302A;--warn:#F5B042;--warn-soft:#33270F;--bad:#F87171;--bad-soft:#3A1A1D;--info:#7DA6F5;--info-soft:#18284A;--vas:#B79CF7;
  --shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}

/* shell */
.app{display:flex;min-height:100%}
.side{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 10px 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand span{font-size:11.5px;color:var(--muted)}
.side h3{margin:10px 0 2px;padding:0 10px;font-size:11px;letter-spacing:.08em;color:var(--faint);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--fg-2);font-size:13.5px;text-decoration:none}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.menu-btn{display:none}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:38px;background:var(--surface);color:var(--muted)}
.search input{border:0;outline:0;background:none;width:100%;height:100%;color:var(--fg);font:inherit}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.user b{display:block;font-size:13px}.user small{display:block;color:var(--muted);font-size:11.5px}
.wrap{padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}

/* page */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--muted)}
h1{margin:2px 0 0;font-size:22px;font-weight:600}
h2{margin:0;font-size:14.5px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-b{padding:14px 16px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}.kpi small{font-size:12px;color:var(--muted)}
.bar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);background:var(--surface-2);padding:8px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line-2);vertical-align:middle}
th.num,td.num{text-align:right}
.alert{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2);align-items:flex-start}
.alert:first-child{border-top:0}
.alert b{display:block;font-size:13px}.alert small{color:var(--muted);font-size:12px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.dl>div>span{display:block;font-size:12px;color:var(--muted)}.dl b{font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:auto}.chart text{fill:var(--muted);font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 10px;vertical-align:-1px}

/* forms (ported from lanewms ibForm) */
input,select,textarea{font:inherit;color:inherit}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--fg-2);min-width:0}
.field input,.field select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--fg);font-size:13.5px;min-width:0}
.field input:focus,.field select:focus,.sd-lines input:focus,.sd-lines textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.flbl{font-weight:600;color:var(--fg)}.req{color:var(--bad);font-weight:600}
.ro-in{background:var(--surface-2)!important;color:var(--muted)!important;cursor:default}
.fgrid{display:grid;gap:12px 14px}.fgrid.f3{grid-template-columns:repeat(3,minmax(0,1fr))}.fgrid .span2{grid-column:span 2}
@media(max-width:900px){.fgrid.f3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.fgrid.f3{grid-template-columns:1fr}.fgrid .span2{grid-column:auto}}
.card-h .note{margin:2px 0 0}
.err{color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;font-size:13px}.err:empty{display:none}
.ib-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ib-bar>span{padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.ib-bar>span.cur{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ib-bar>i{color:var(--muted);font-style:normal}
.ib-bar>.ib-meta{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0;background:none;color:var(--fg-2)}
@media(max-width:600px){.ib-bar>.ib-meta{margin-left:0}}
table.sd-lines{min-width:880px}
table.sd-lines td{vertical-align:top;padding:10px 6px}
table.sd-lines th{padding:8px 6px}
table.sd-lines input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--fg);font-size:13px;min-width:0}
table.sd-lines input.num{text-align:right}
table.sd-lines td.pad{padding-top:19px}
.ib-codecell{display:inline-block;padding-top:9px}
.ib-item{display:flex;gap:12px;align-items:flex-start;padding:2px 0}
.ib-thumb{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--faint);background:var(--surface-2)}
.ib-item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ib-item-top,.ib-itemcard{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib-itemcard{min-height:36px}
.ib-item-top b{font-size:13.5px;letter-spacing:.01em}
.ib-item textarea{width:100%;min-height:52px;resize:vertical;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg)}
.ib-item textarea:focus{background:var(--surface)}
.ib-tag{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px}
.ib-round{flex:none;width:24px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;font-size:14px;line-height:1;padding:0}
.ib-round:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.del:hover{border-color:var(--bad);color:var(--bad)}
.form-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:50;max-width:calc(100% - 32px)}

/* sidebar groups */
.nav{width:100%;border:0;background:none;cursor:pointer;text-align:left}
.nav svg{flex:none;color:var(--muted)}.nav.on svg,.nav.open svg{color:inherit}
.nav.open{color:var(--accent);font-weight:600}
.nav .chev{margin-left:auto;transition:transform .15s}.nav.open .chev{transform:rotate(180deg)}
.subs{display:flex;flex-direction:column;margin:2px 0 6px 19px;padding-left:12px;border-left:1px solid var(--line)}
.sub-row{position:relative;display:flex;align-items:center}
.sub{flex:1;min-width:0;padding:7px 10px;border-radius:6px;color:var(--fg-2);font-size:13px;text-decoration:none}
.sub:hover{color:var(--fg);background:var(--surface-2)}
.sub.on{color:var(--accent);font-weight:600}
.nav-plus{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:.5;text-decoration:none}
.sub-row:hover .nav-plus,.nav-plus:focus-visible,.sub-row:has(.sub.on) .nav-plus{opacity:1}
.nav-plus:hover{background:var(--accent);color:var(--accent-ink)}
@media (hover:none){.nav-plus{opacity:1}}

/* lists */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .field{min-width:160px;flex:0 1 190px}.filters .field.grow{flex:1 1 240px}
td.mono,td b.mono,td span.mono{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.sorth{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}.sorth:hover{color:var(--accent)}
.rowicons{display:flex;gap:4px;justify-content:flex-end}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
tfoot td{font-weight:600;background:var(--surface-2)}
.warnbox{padding:10px 14px;border:1px solid var(--warn);border-radius:10px;background:var(--warn-soft);font-size:13px}

/* customer form */
.f2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:640px){.f2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start;background:var(--surface)}
.seg label{position:relative;display:flex;align-items:center;height:36px;padding:0 16px;font-size:13px;cursor:pointer;border-right:1px solid var(--line);color:var(--fg-2)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-size:13px;cursor:pointer;color:var(--fg-2)}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13.5px;resize:vertical}
.hint{color:var(--muted);font-size:11.5px;font-weight:400}
.ad2{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:10px 20px;align-items:center}
.ad2-h{font-size:12.5px;color:var(--muted)}.ad2-l{font-size:13px;color:var(--fg-2)}
.ad2 input{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.ad2 select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.ad2 input.ad2-auto{background:var(--surface-2);color:var(--muted)}
@media(max-width:760px){.ad2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ad2-l{grid-column:1/-1;margin-top:6px}.ad2>span:first-child{display:none}}
.ctab input,.ctab select{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--surface);color:var(--fg);width:100%;min-width:90px}
.ctab input[type=radio]{width:16px;min-width:16px;height:16px;accent-color:var(--accent)}
.ctab td{padding:6px}
.ctab{min-width:900px}

/* quotation form */
.qt-rows{display:flex;flex-direction:column;gap:14px}
.qt-row{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:start}
.qt-lbl{font-size:13px;color:var(--fg-2);padding-top:9px;font-weight:600}.qt-lbl.req{color:var(--bad)}
.qt-val select{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--surface);color:var(--fg);max-width:560px;width:100%}
.qt-addr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5}
.qt-cap{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.qt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.qt-contacts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qt-cbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.qt-cbox h3{margin:0;font-size:13px}
@media(max-width:900px){.qt-row{grid-template-columns:1fr}.qt-addr,.qt-grid,.qt-contacts{grid-template-columns:1fr}.qt-lbl{padding-top:0}}
table.sd-lines select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);color:var(--fg);font-size:13px}
table.sd-lines .sd-desc{margin-top:6px;height:32px;font-size:12.5px;color:var(--fg-2)}
.sd-amt{padding-top:19px!important;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.sd-tot{min-width:min(320px,100%);display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.sd-tot>div{display:flex;justify-content:space-between;align-items:center;gap:16px;font-variant-numeric:tabular-nums}
.sd-tot input{width:110px;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface);color:var(--fg);text-align:right}
.sd-grand{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:15px}
.catsel{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--fg)}

/* contract form */
.ctr-liab{display:flex;flex-direction:column;gap:16px}
.ctr-sub{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ctr-sub h3{margin:0;font-size:13.5px}.ctr-sub>.note{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* items */
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
@media(max-width:900px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.igrid{grid-template-columns:minmax(0,1fr)}}
.full{grid-column:1/-1}
.subbox{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.crow select{width:150px;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--surface);color:var(--fg)}
.crow input{width:110px;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--surface);color:var(--fg)}
.switch{position:relative;display:inline-flex;align-items:center;cursor:pointer;flex:none;margin-top:2px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span[aria-hidden]{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch span[aria-hidden]::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.it-sw{display:flex;gap:12px;align-items:flex-start}.it-sw b{font-size:14px}.it-sw small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;max-width:780px}

/* =====================================================================

   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => Number(v || 0).toLocaleString('en-US');
const sar = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const TONE = { High: 'bad', Medium: 'warn', Info: 'info', Draft: 'mute', Submitted: 'info', Available: 'good', 'Enter qty': 'warn', New: 'mute', Allocated: 'info', Picking: 'warn', Picked: 'warn', Dispatched: 'info', Delivered: 'good', Cancelled: 'mute' };
const pill = s => `<span class="pill p-${TONE[s] || (/^Short/.test(s) ? 'bad' : 'mute')}">${esc(s)}</span>`;
const card = (title, body, extra = '') => `<section class="card"><div class="card-h"><h2>${title}</h2><div class="row">${extra}</div></div>${body}</section>`;
const isLate = o => ['New', 'Allocated', 'Picking', 'Picked'].includes(o.status) && o.due < iso(today);

/* =====================================================================
   SECTIONS
   ===================================================================== */
function kpis(d) {
  const cap = sum(d.warehouses, w => w.capacity), used = sum(d.warehouses, w => w.pallets), pct = cap ? Math.round(used / cap * 100) : 0;
  const k = (label, value, sub, extra = '') => `<div class="card kpi"><span>${label}</span><b>${value}</b>${extra}<small>${sub}</small></div>`;
  return `<section class="grid g-kpi" aria-label="Key figures">
    ${k('Active customers', n0(d.customers), `${n0(d.skus)} SKUs under management`)}
    ${k('Pallets in stock', n0(d.pallets), `${n0(d.units)} units`)}
    ${k('Space utilisation', pct + '%', `${used} of ${cap} pallet positions`, `<div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>`)}
    ${k('Shipped today', n0(d.shippedToday), `${n0(d.dueSoon)} orders due today or tomorrow`)}
    ${k('On-time dispatch', d.onTime.total ? Math.round(d.onTime.ok / d.onTime.total * 100) + '%' : '—', `${d.onTime.ok} of ${d.onTime.total} orders by due date`)}
    ${k('Revenue this month', sar(d.revenueMonth), `SAR, ex VAT · ${sar(d.unbilled)} unbilled`)}
  </section>`;
}

function flowChart(d) {
  const ins = d.flow.map(x => x.in), outs = d.flow.map(x => x.out);
  const max = Math.max(10, ...ins, ...outs), step = Math.ceil(max / 4 / 10) * 10 || 10, top = step * 4;
  const X = i => 58 + i * 72, Y = v => 170 - v / top * 150;
  const svg = `<svg class="chart" viewBox="0 0 560 200" role="img" aria-label="Units received and shipped per day, last 7 days">
    ${[0, 1, 2, 3, 4].map(k => `<line x1="44" x2="550" y1="${Y(k * step)}" y2="${Y(k * step)}" stroke="var(--line${k ? '-2' : ''})"/><text x="38" y="${Y(k * step) + 4}" text-anchor="end">${n0(k * step)}</text>`).join('')}
    ${d.flow.map((x, i) => `<rect x="${X(i)}" y="${Y(x.in)}" width="24" height="${170 - Y(x.in)}" rx="2" fill="var(--accent)"><title>Received ${n0(x.in)}</title></rect>
      <rect x="${X(i) + 26}" y="${Y(x.out)}" width="24" height="${170 - Y(x.out)}" rx="2" fill="var(--accent-2)"><title>Shipped ${n0(x.out)}</title></rect>
      <text x="${X(i) + 25}" y="190" text-anchor="middle">${new Date(x.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' })}</text>`).join('')}
  </svg>`;
  return card('Units received vs shipped · last 7 days', `<div class="card-b">${svg}</div>`,
    `<span class="note legend"><i style="background:var(--accent);margin-left:0"></i>Received <i style="background:var(--accent-2)"></i>Shipped</span>`);
}

function workQueue(d) {
  return card("Today's work queue", `<div class="tbl-wrap"><table><thead><tr><th>Task</th><th>Module</th><th class="num">Open</th><th></th></tr></thead><tbody>
    ${d.queue.map(q => `<tr><td>${esc(q.task)}</td><td class="note">${esc(q.module)}</td><td class="num"><b>${n0(q.open)}</b></td><td class="num"><a class="btn sm" href="${esc(q.href)}">Open</a></td></tr>`).join('')}
  </tbody></table></div>`);
}

function alerts(d) {
  const body = d.alerts.length
    ? d.alerts.map(a => `<div class="alert">${pill(a.level)}<div><b>${esc(a.title)}</b><small>${esc(a.detail)}</small></div></div>`).join('')
    : '<div class="empty">No alerts. Everything is within limits.</div>';
  return card('Alerts', body, `<span class="pill p-${d.alerts.some(a => a.level === 'High') ? 'bad' : 'mute'}">${d.alerts.length} open</span>`);
}

function occupancy(d) {
  const rows = d.warehouses.map(w => {
    const pc = w.capacity ? Math.round(w.pallets / w.capacity * 100) : 0;
    const col = pc > 90 ? 'var(--bad)' : pc > 80 ? 'var(--accent-2)' : 'var(--accent)';
    return `<div><div class="row" style="justify-content:space-between"><span>${esc(w.name)}</span><b class="num">${pc}%</b></div>
      <div class="bar"><i style="width:${Math.min(100, pc)}%;background:${col}"></i></div><span class="note">${w.pallets} of ${w.capacity} pallets</span></div>`;
  }).join('');
  return card('Warehouse occupancy', `<div class="card-b" style="display:flex;flex-direction:column;gap:12px">${rows}<span class="note">Red above 90%, amber above 80%.</span></div>`,
    `<a class="btn sm" href="#warehouses">Space</a>`);
}

function billing(d) {
  const col = { Storage: 'var(--accent)', Handling: 'var(--info)', VAS: 'var(--vas)', Transport: 'var(--warn)' };
  const ent = Object.entries(d.revenueMix).filter(([, v]) => v), tot = sum(ent, e => e[1]) || 1;
  const mix = `<div><div style="display:flex;height:10px;border-radius:5px;overflow:hidden">${ent.map(([k, v]) => `<i style="width:${v / tot * 100}%;background:${col[k]}" title="${k}"></i>`).join('')}</div>
    <div class="row note" style="margin-top:8px;gap:14px">${ent.map(([k, v]) => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col[k]};margin-right:5px"></i>${k} ${Math.round(v / tot * 100)}%</span>`).join('')}</div></div>`;
  return card('Billing', `<div class="card-b" style="display:flex;flex-direction:column;gap:12px">
    <div class="dl"><div><span>Charges this month</span><b>${n0(d.chargesMonth)}</b></div><div><span>Invoices issued</span><b>${n0(d.invoicesIssued)}</b></div>
      <div><span>Unbilled, SAR</span><b>${sar(d.unbilled)}</b></div><div><span>Overdue, SAR</span><b style="color:${d.overdue ? 'var(--bad)' : 'inherit'}">${sar(d.overdue)}</b></div></div>
    ${mix}<a class="btn sm pri" href="#billing" style="align-self:flex-start">Run billing</a></div>`);
}

function recentOrders(d) {
  const body = d.orders.length ? `<div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Ship to</th><th>Warehouse</th><th class="num">Lines</th><th class="num">Units</th><th>Due</th><th>Status</th></tr></thead><tbody>
    ${d.orders.map(o => `<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.customer)}</td><td>${esc(o.shipTo)}</td><td>${esc(o.warehouse)}</td><td class="num">${n0(o.lines)}</td><td class="num">${n0(o.units)}</td>
      <td>${fmtDate(o.due)}${isLate(o) ? ' <span class="pill p-bad">Late</span>' : ''}</td><td>${pill(o.status)}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">No outbound orders yet.</div>';
  return card('Recent outbound orders', body, `<a class="btn sm" href="#outbound">All orders</a>`);
}

function dashboard(d) {
  return `
    <div class="head"><div><div class="crumb">Dashboard</div><h1>Operations Dashboard</h1></div>
      <div class="actions"><a class="btn" href="#asn/new">+ New ASN</a><a class="btn pri" href="#oborders/new">+ Outbound order</a></div></div>

}

const newAsn = () => { while (DB.asns.some(x => x.id === 'ASN-' + DB.seq.ASN)) DB.seq.ASN++; return ({ kind: 'asn', saved: false, id: 'ASN-' + DB.seq.ASN, status: 'Draft', created: iso(today),

  const locked = a.status !== 'Draft';
  if (locked) setTimeout(() => document.querySelectorAll('#ibForm :is(input,select,textarea,button)').forEach(el => el.disabled = true), 0);

  ${sec('Expected item lines', `<div class="card-b"><div class="tbl-wrap"><table class="sd-lines"><thead><tr><th class="num" style="width:50px">S.No</th><th style="width:150px">Item code</th><th style="min-width:320px">Item name</th><th style="width:170px">Cust. item code</th><th class="num" style="width:130px">Expected qty</th><th style="width:90px">UOM</th><th style="width:44px"></th></tr></thead>

    : [...(['Submitted', 'Approved'].includes(a.status) ? [['Cancel ASN', 'cancelAsn', 'danger']] : []), ...(a.status === 'Submitted' ? [['Approve', 'approveAsn', 'pri']] : []), ...(ibRcvElig(a) ? [['Convert to receiving →', 'toReceiving', 'pri']] : [])])}`;
}

function validateAsn(a) {
  if (!a.client) throw new Error('Choose the customer.');
  if (!a.eta) throw new Error('Enter the expected arrival date.');
  const W = whRec(a.wh); if (!W.id) throw new Error('Choose the warehouse.');
  if (W.status !== 'Active') throw new Error(W.name + ' is not active.');
  if (W.blockPlace === 'Yes') throw new Error(W.name + ' has Block placement set' + (W.reason ? ' (' + W.reason + ')' : '') + '.');
  [['vehicle', 'Vehicle No'], ['driver', 'Driver name'], ['driverId', 'Driver ID / Iqama'], ['mobile', 'Driver mobile']]
    .forEach(([f, l]) => { if (!a[f]) throw new Error('Enter the ' + l + '. It is required.'); });
  if (a.mobile && !/^[+0-9 ()-]{7,}$/.test(a.mobile)) throw new Error('Driver mobile does not look like a phone number.');
  if (!a.lines.length) throw new Error('Add at least one item line.');
  a.lines.forEach((l, i) => { const n = 'Line ' + (i + 1) + ': ';
    if (!l.sku) throw new Error(n + 'choose the item.');
    if (item(l.sku).client !== a.client) throw new Error(n + item(l.sku).code + ' belongs to another customer.');
    if (!(l.qty > 0) || !Number.isInteger(l.qty)) throw new Error(n + 'expected quantity must be a whole number above 0.'); });
}

/* =====================================================================
   NEW OUTBOUND ORDER  (ERP: Outbound › Customer Orders)
   ===================================================================== */
const obNo = w => { const loc = whRec(w).loc || 'JED'; return 'OB-' + loc + '-' + String(DB.seq.OB[loc] || 1).padStart(5, '0'); };
const newOrder = () => { const w = (whOpts()[0] || [''])[0];
  return { kind: 'order', saved: false, id: obNo(w), status: 'Draft', type: M.orderTypes[0], odate: iso(today), client: custOpts()[0][0], ref: '', wh: w,
    priority: 'Normal', due: iso(addDays(today, 1)), customer: '', address: '', contact: '', phone: '', lines: [blankLine()] }; };
const lineCheck = (o, l) => { const av = avail(o.wh, l.sku); return !l.sku ? '' : !(+l.qty > 0) ? 'Enter qty' : +l.qty > av ? 'Short ' + n0(+l.qty - av) : 'Available'; };

function orderLine(o, l, i) {
  if (!l.sku) return `<tr class="ib-ln" data-i="${i}"><td class="num pad note">${i + 1}</td>${searchCells()}<td class="num pad">—</td><td>${qtyIn(l)}</td><td class="pad"><span class="note">Auto</span></td><td></td><td>${delBtn(i)}</td></tr>`;
  const it = item(l.sku), v = lineCheck(o, l);
  return `<tr class="ib-ln" data-i="${i}"><td class="num pad note">${i + 1}</td>
    <td><b class="mono ib-codecell">${esc(it.code)}</b><input type="hidden" data-l="sku" value="${esc(l.sku)}"></td>
    <td><div class="ib-itemcard"><b>${esc(it.name)}</b><button type="button" class="ib-round" data-act="clearItem" data-id="${i}" aria-label="Change item" title="Change item">×</button></div></td>
    <td class="mono pad">${esc(it.custCode)}</td><td class="num pad">${n0(avail(o.wh, l.sku))}</td><td>${qtyIn(l)}</td><td class="pad">${esc(it.uom)}</td>
    <td class="pad vcell">${v ? pill(v) : ''}</td><td>${delBtn(i)}</td></tr>`;
}

function orderPage(o) {
  const locked = o.status !== 'Draft';
  if (locked) setTimeout(() => document.querySelectorAll('#ibForm :is(input,select,textarea,button)').forEach(el => el.disabled = true), 0);
  return `${head2('<a href="#oborders" style="color:inherit">Outbound · Outbound Orders</a>', 'Outbound Order · ' + esc(o.id), '<a class="btn" href="#oborders">← All outbound orders</a>')}
  ${obChain(o, 'oborders')}
  ${locked ? `<p class="note" style="margin:0">This order is ${esc(obStSt.oborders(o).toLowerCase())} and read-only.${o.backorderOf ? ' Backorder of ' + esc(o.backorderOf) + '.' : ''}${o.backorder ? ' Remaining balance: backorder ' + esc(o.backorder) + '.' : ''}</p>` : ''}
  <div class="err" id="ibErr" role="alert"></div>
  <form id="ibForm" onsubmit="return false" style="display:flex;flex-direction:column;gap:14px">
  ${sec('Outbound Order', `<div class="card-b fgrid f3">
    ${ro('Order No.', o.id)}
    ${fld('Order type', sel('type', M.orderTypes.map(x => [x, x]), o.type))}
    ${fld('Order date', inp('odate', o.odate, { type: 'date' }), 1)}
    ${fld('Customer / stock owner', sel('client', custOpts(), o.client), 1)}
    ${fld('Customer Ref.', inp('ref', o.ref, { ph: 'Customer PO / order no.' }))}
    ${fld('Warehouse', sel('wh', whOpts(), o.wh), 1)}
    ${fld('Priority', sel('priority', M.priorities.map(x => [x, x]), o.priority))}
    ${fld('Requested dispatch date', inp('due', o.due, { type: 'date' }), 1)}
    ${fld('Ship to (consignee)', inp('customer', o.customer), 1)}
    ${fld('Delivery address', inp('address', o.address), 1, 'span2')}
    ${fld('Contact person', inp('contact', o.contact))}
    ${fld('Contact phone', inp('phone', o.phone, { type: 'tel' }))}</div>`)}
  ${sec('Order lines', `<div class="card-b"><div class="tbl-wrap"><table class="sd-lines"><thead><tr><th class="num" style="width:50px">S.No</th><th style="width:140px">Item code</th><th style="min-width:240px">Item name</th><th style="width:160px">Cust. item code</th><th class="num" style="width:90px">Available</th><th class="num" style="width:120px">Order qty</th><th style="width:90px">UOM</th><th style="width:130px">Validation</th><th style="width:44px"></th></tr></thead>
    <tbody>${o.lines.map((l, i) => orderLine(o, l, i)).join('')}</tbody></table></div>${datalists(o.client)}
    <button type="button" class="btn sm" data-act="addLine" style="margin-top:10px">+ Add line</button></div>`,
    'Available = this customer’s stock in the warehouse that is free to allocate (available status, not reserved, not blocked).')}
  </form>
  ${foot(o.status === 'Draft' ? [...(o.saved ? [['Delete draft', 'deleteDraft', 'danger']] : []), ['Save draft', 'saveDraft'], ['Approve &amp; release', 'approveOrder', 'pri']]
    : [...(['New', 'Allocated'].includes(o.status) ? [['Cancel order', 'cancelOrder', 'danger']] : []), ...(o.status === 'New' ? [['Convert to stock allocation →', 'toAlloc', 'pri']] : [])])}`;
}

function validateOrder(o) {
  if (!o.client) throw new Error('Choose the customer.');
  const W = whRec(o.wh); if (!W.id) throw new Error('Choose the warehouse.');
  if (W.status !== 'Active') throw new Error(W.name + ' is not active.');
  if (!o.customer) throw new Error('Enter the ship-to (consignee) name.');
  if (!o.address) throw new Error('Enter the delivery address.');
  if (!o.due) throw new Error('Enter the requested dispatch date.');
  if (o.phone && !/^[+0-9 ()-]{7,}$/.test(o.phone)) throw new Error('Contact phone does not look like a phone number.');
  const ls = o.lines.filter(l => l.sku);
  if (!ls.length) throw new Error('Add at least one item line.');
  if (o.lines.some(l => !l.sku)) throw new Error('Choose an item on every line or remove the empty line.');
  ls.forEach((l, i) => {
    if (item(l.sku).client !== o.client) throw new Error('Line ' + (i + 1) + ': ' + item(l.sku).code + ' belongs to another customer.');
    if (!(l.qty > 0) || !Number.isInteger(l.qty)) throw new Error('Line ' + (i + 1) + ': order quantity must be a whole number above 0.'); });
  const dup = ls.map(l => l.sku).find((s, i, a) => a.indexOf(s) !== i);
  if (dup) throw new Error(item(dup).code + ' is on two lines. Combine them into one line.');
}

/* =====================================================================
   FORM BEHAVIOUR
   ===================================================================== */
function readForm() {
  const fm = $('#ibForm'); if (!fm || !draft) return;
  fm.querySelectorAll('[name]').forEach(el => { draft[el.name] = el.value.trim(); });
  draft.lines = [...fm.querySelectorAll('.ib-ln')].map(r => {
    const g = k => { const el = r.querySelector(`[data-l="${k}"]`); return el ? el.value.trim() : ''; };
    const q = g('qty'); return { sku: g('sku'), qty: q === '' ? '' : (+q || 0), desc: g('desc') };
  });
}
function renderForm(focus) {
  $('#view').innerHTML = draft.kind === 'asn' ? asnPage(draft) : orderPage(draft);
  if (focus) { const el = $(focus); if (el) el.focus(); }
}
function showErr(msg) { const e = $('#ibErr'); e.textContent = msg; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

function store() {   // insert or update the draft in saved records
  if (draft.kind === 'asn') { ibNorm(draft); if (!draft.saved) ibAudit(draft, 'ASN created'); } else { obNorm(draft); if (!draft.saved) { draft.created = draft.created || iso(today); ibAudit(draft, 'Order created'); } }
  if (!draft.saved) {
    if (draft.kind === 'asn') { while (DB.asns.some(x => x.id === draft.id)) { DB.seq.ASN++; draft.id = 'ASN-' + DB.seq.ASN; } DB.seq.ASN++; }
    else { const loc = whRec(draft.wh).loc; while (DB.orders.some(x => x.id === draft.id)) { DB.seq.OB[loc] = (DB.seq.OB[loc] || 1) + 1; draft.id = obNo(draft.wh); } DB.seq.OB[loc] = (DB.seq.OB[loc] || 1) + 1; }
    draft.saved = true;
  }
  const list = draft.kind === 'asn' ? DB.asns : DB.orders, rec = { ...draft }, i = list.findIndex(x => x.id === rec.id);
  delete rec.kind; delete rec.saved;
  if (i >= 0) list[i] = rec; else list.push(rec);
  persist();
}
function leave(msg, to = '#dashboard') { draft = null; go(to); toast(msg); }

const ACT = {
  addLine() { readForm(); draft.lines.push(blankLine()); renderForm(`[data-i="${draft.lines.length - 1}"] [data-l="code"]`); },
  delLine(i) { readForm(); draft.lines.splice(+i, 1); if (!draft.lines.length) draft.lines.push(blankLine()); renderForm(); },
  clearItem(i) { readForm(); draft.lines[+i].sku = ''; renderForm(`[data-i="${i}"] [data-l="code"]`); },
  saveDraft() { readForm(); store(); renderForm(); toast(draft.id + ': Draft saved.'); },
  deleteDraft() {
    const id = draft.id, was = draft.saved;
    if (was) { const k = draft.kind === 'asn' ? 'asns' : 'orders'; DB[k] = DB[k].filter(x => x.id !== id); persist(); }
    leave(was ? id + ' deleted.' : 'Draft discarded.', draft.kind === 'asn' ? '#asn' : '#oborders');
  },
  submitAsn() {
    readForm();
    try { validateAsn(draft); } catch (e) { return showErr(e.message); }
    draft.status = 'Submitted'; draft.submittedAt = iso(today); ibAudit(draft, 'ASN submitted'); store(); leave(draft.id + ' submitted. It is now waiting for approval.', '#asn');
  },
  approveAsn() {
    try { validateAsn(draft); } catch (e) { return showErr(e.message); }
    draft.status = 'Approved'; draft.acceptedAt = iso(today); draft.acceptedBy = DATA.user.name; ibAudit(draft, 'ASN approved'); store(); leave(draft.id + ' approved. It is now in the Receiving list.', '#asn');
  },
  cancelAsn() {
    if (!['Draft', 'Submitted', 'Approved'].includes(draft.status)) return showErr('Cancellation after arrival needs an exception process.');
    if (!confirm('Cancel ' + draft.id + '? It stays on record as Cancelled.')) return;
    draft.status = 'Cancelled'; ibAudit(draft, 'ASN cancelled'); store(); leave(draft.id + ' cancelled.', '#asn');
  },
  toReceiving() { const id = draft.id; draft = null; go('#receiving/edit/' + encodeURIComponent(id)); },
  approveOrder() {
    readForm();
    try { validateOrder(draft); } catch (e) { return showErr(e.message); }
    const o = draft, sh = o.lines.filter(l => l.qty > avail(o.wh, l.sku)).length;
    o.status = 'New'; o.approvedBy = DATA.user.name; o.approvedAt = iso(today); ibAudit(o, 'Order approved and released'); store();
    leave(o.id + ' approved.' + (sh ? ' ' + sh + (sh === 1 ? ' line exceeds' : ' lines exceed') + ' available stock — allocation will be partial.' : ' It is now in Allocate Stock.'), '#oborders');
  },
  cancelOrder() {
    if (!['New', 'Allocated'].includes(draft.status)) return showErr('Only approved or allocated orders can be cancelled.');
    if (!confirm('Cancel ' + draft.id + '? Any reserved stock is released.')) return;
    const o = obO(draft.id); obRelease(o); o.status = 'Cancelled'; ibAudit(o, 'Order cancelled'); persist(); leave(o.id + ' cancelled.', '#oborders');
  },
  toAlloc() { const id = draft.id; draft = null; go('#alloc/edit/' + encodeURIComponent(id));
  }
};

// pick an item from the code / name / customer-code search boxes
function pickItem(t, strict) {
  const v = t.value.trim(); if (!v) return;
  const k = v.split(' · ')[0].toLowerCase();
  const it = itemsOf(draft.client).find(x => x.code.toLowerCase() === k || x.name.toLowerCase() === v.toLowerCase() || x.sku.toLowerCase() === k || x.custCode.toLowerCase() === k);
  if (!it) { if (strict) { t.value = ''; toast('No item matches "' + v + '" for ' + clName(draft.client) + '.'); } return; }
  const i = +t.closest('.ib-ln').dataset.i;
  readForm(); draft.lines[i].sku = it.sku; renderForm(`[data-i="${i}"] [data-l="qty"]`);
}

$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && draft && $('#ibForm') && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset.id);
});
$('#view').addEventListener('input', e => {
  if (draft && e.target.closest('#ibForm') && ['code', 'name', 'cust'].includes(e.target.dataset.l) && (!e.inputType || e.inputType === 'insertReplacementText')) pickItem(e.target, false);
});
$('#view').addEventListener('change', e => {
  const t = e.target; if (!draft || !t.closest('#ibForm')) return;
  if (['code', 'name', 'cust'].includes(t.dataset.l)) return pickItem(t, true);
  if (t.name === 'client') {
    readForm(); const before = draft.lines.filter(l => l.sku).length;
    draft.lines = draft.lines.filter(l => !l.sku || item(l.sku).client === draft.client);
    if (!draft.lines.length) draft.lines.push(blankLine());
    if (before > draft.lines.filter(l => l.sku).length) toast('Items from the previous customer were removed.');
    return renderForm('[name="client"]');
  }
  if (t.name === 'wh') { readForm(); if (draft.kind === 'order' && !draft.saved) draft.id = obNo(draft.wh); return renderForm('[name="wh"]'); }
  if (t.dataset.l === 'qty' && draft.kind === 'order') {
    const r = t.closest('.ib-ln'), c = r.querySelector('.vcell'); readForm();
    if (c) { const v = lineCheck(draft, draft.lines[+r.dataset.i]); c.innerHTML = v ? pill(v) : ''; }
  }
});

/* =====================================================================
   SHARED LIST HELPERS
   ===================================================================== */
Object.assign(TONE, { Active: 'good', Inactive: 'mute', Sent: 'info', Accepted: 'good', Declined: 'bad', Expired: 'bad', 'Pending approval': 'warn', Superseded: 'mute', Terminated: 'bad' });
const optA = list => list.map(x => [x, x]);
const FILT = {};
const go = h => { if (location.hash === h) { route(); window.scrollTo(0, 0); } else location.hash = h; };
function filterBar(key, defs) {
  const f = FILT[key] || {};
  return `<div class="card"><div class="card-b filters">${defs.map(d => d.type === 'text'

function updateCustForm(t) {

  const tax = q('tax').value, needVat = biz && /VAT registered$/.test(tax) && !/non-VAT/i.test(tax);
  $('#cu_vatF').style.display = needVat ? 'contents' : 'none';

  if (t && /^[bs]_(short|bldg|addl|zip)$/.test(t.name || '')) { const o = fm.querySelector(`[data-arof="${t.name}"]`); if (o) o.value = arDigits(t.value.toUpperCase()); }

}

const custErr = (msg, tab) => { const e = new Error(msg); e.tab = tab; return e; };
function validateCustomer(d, editId) {
  const em = /^[^\s@]+@[^\s@]+\.[^\s@]+$/, ph = /^\+?[\d\s()-]{7,20}$/;
  if (!/^[A-Z0-9][A-Z0-9-]{1,14}$/.test(d.id)) throw custErr('The customer code uses letters, digits and dashes.');
  if (!editId && DB.customers.some(c => c.id === d.id)) throw custErr('Customer code ' + d.id + ' is already used.');
  if (d.type === 'Business' && !d.company) throw custErr('Enter the company name.');
  if (!d.name) throw custErr('Enter the display name in English.');
  if (d.email && !em.test(d.email)) throw custErr('The email address is not valid.');
  if (d.phone && !ph.test(d.phone)) throw custErr('The phone number can use digits, spaces, dashes and a leading +.');
  const ksa = ['VAT registered', 'Non-VAT registered'].includes(d.tax), gcc = /^GCC/.test(d.tax);
  if (ksa && d.place !== 'Saudi Arabia') throw custErr('For a Saudi customer the place of supply is Saudi Arabia.', 'details');
  if (gcc && !GCC.slice(1).includes(d.place)) throw custErr('For a GCC customer, choose a GCC country other than Saudi Arabia as place of supply.', 'details');
  if (d.tax === 'Non-GCC' && GCC.includes(d.place)) throw custErr('A non-GCC customer needs a place of supply outside the GCC.', 'details');
  if (DB.customers.some(c => c.id !== editId && c.name.trim().toLowerCase() === d.name.trim().toLowerCase())) throw custErr('Another customer is already called ' + d.name + '. Use a different display name.');
  if (d.tax === 'VAT registered' && !/^3\d{13}3$/.test(d.vat)) throw custErr('A Saudi VAT number has 15 digits and starts and ends with 3.', 'details');
  if (d.tax === 'GCC VAT registered' && !/^[A-Z0-9]{9,15}$/i.test(d.vat)) throw custErr('Enter the customer\'s GCC VAT number (9 to 15 letters or digits).', 'details');
  if (!/VAT registered$/.test(d.tax) || /non-VAT/i.test(d.tax)) d.vat = '';
  if (d.cr && d.place === 'Saudi Arabia' && !/^\d{10}$/.test(d.cr)) throw custErr('A Saudi CR number has 10 digits.', 'details');
  if (d.credit < 0) throw custErr('The credit limit cannot be negative.', 'details');
  const chk = (a, label) => { if (a.country !== 'Saudi Arabia') return;
    if (a.short && !/^[A-Z]{4}\d{4}$/.test(a.short)) throw custErr(label + ': the short address is 4 letters and 4 digits, e.g. JEDA1234.', 'address');
    if (a.bldg && !/^\d{4}$/.test(a.bldg)) throw custErr(label + ': the building number has 4 digits.', 'address');
    if (a.addl && !/^\d{4}$/.test(a.addl)) throw custErr(label + ': the additional number has 4 digits.', 'address');
    if (a.zip && !/^\d{5}$/.test(a.zip)) throw custErr(label + ': the zip code has 5 digits.', 'address'); };
  chk(d.billing, 'Billing address'); if (!d.sameShip) chk(d.shipping, 'Shipping address');
  d.contacts.forEach((x, i) => { if (x.email && !em.test(x.email)) throw custErr('Contact ' + (i + 1) + ': the email address is not valid.', 'contacts'); });
}

function qtValidate(d, final) {
  if (!d.client) throw new Error('Choose the customer.');

function renderContract() {

function readContract() {
  const fm = $('#ctrForm'); if (!fm || kRO) return kDoc;
  const k = kDoc; fm.querySelectorAll('[name]').forEach(x => k[x.name] = x.value.trim());
  ['notice', 'terms', 'credit', 'freeDays', 'turnaround', 'rcvTurn', 'accuracy', 'liabPallet', 'liabEvent', 'liabYear', 'claimNotify', 'claimSubmit', 'sumInsured'].forEach(n => k[n] = +k[n] || 0);
  k.liability = ctrLiabText(k);
  k.lines = [...fm.querySelectorAll('#ctrLines .ctr-ln')].map(r => { const o = {}; r.querySelectorAll('[data-l]').forEach(x => o[x.dataset.l] = x.value.trim()); const s = svcBy(o.code);
    return { code: o.code, name: s.name || '', cat: s.cat || '', unit: o.unit || s.unit || '', rate: o.rate === '' ? '' : +o.rate, minFee: +o.minFee || 0 }; });
  return k;
}
function ctrValidate(k) {
  if (!k.client) throw new Error('Choose the customer.');
  if (!k.start || !k.end) throw new Error('Enter the start and end dates.');
  if (k.end < k.start) throw new Error('The end date is before the start date.');
  const ls = k.lines.filter(l => l.code); if (!ls.length) throw new Error('Add at least one service with its rate.');
  const seen = new Set(); ls.forEach(l => { if (seen.has(l.code)) throw new Error(l.code + ' is on the contract twice.'); seen.add(l.code); if (l.rate === '' || !(l.rate >= 0)) throw new Error('Enter the contract rate for ' + l.code + '.'); });
  const clash = DB.contracts.find(x => x.id !== k.id && x.client === k.client && x.id !== k.replaces && ['Active', 'Pending approval'].includes(ctrState(x)) && !(x.end < k.start || x.start > k.end));
  if (clash && clash.status === 'Pending approval') throw new Error(clash.id + ' for this customer is already waiting for approval.');
  if (clash && !k.replaces) throw new Error(clash.id + ' is already active for ' + clName(k.client) + ' in this period. Open it and revise it instead.');
  if (k.accuracy > 100) throw new Error('The stock accuracy target cannot be above 100%.');
  k.lines = ls;
}

const DO = {
  clearFilt(key) { FILT[key] = {}; route(); },
  csort(k) { custSort = { k, dir: custSort.k === k ? -custSort.dir : 1 }; route(); },
  delCust(id) {
    const c = client(id), used = [[DB.quotes, 'quotation'], [DB.contracts, 'contract'], [DB.asns, 'ASN'], [DB.orders, 'outbound order']].map(([l, n]) => [l.filter(x => x.client === id).length, n]).filter(x => x[0]);
    if (DB.items.some(i => i.client === id)) used.push([DB.items.filter(i => i.client === id).length, 'item']);
    if (used.length) return toast(`${c.name} has ${used.map(([n, w]) => n + ' ' + w + (n === 1 ? '' : 's')).join(', ')}. Set the customer to Inactive instead of deleting.`);
    if (!confirm('Delete ' + c.name + '? This cannot be undone.')) return;
    DB.customers = DB.customers.filter(x => x.id !== id); persist(); toast(c.name + ' deleted.'); go('#customers');
  },
  ctab(k) { showTab(k); },
  addContact() { $('#contactRows').insertAdjacentHTML('beforeend', contactRow({})); $('#contactRows tr:last-child [data-c="name"]').focus(); },
  delContact(_, b) { const tr = b.closest('tr'); if ($('#contactRows').children.length > 1) tr.remove(); else tr.querySelectorAll('input:not([type=radio])').forEach(i => i.value = ''); },
  delDoc(i) { custDocs.splice(+i, 1); $('#docList').innerHTML = docList(); },
  saveCust(mode) {
    const fm = $('#custForm'), editId = fm.dataset.edit, d = readCustForm();
    try { validateCustomer(d, editId); } catch (e) { if (e.tab) showTab(e.tab); return formErr('#cuErr', e); }
    if (editId) DB.customers[DB.customers.findIndex(c => c.id === editId)] = d; else DB.customers.push(d);
    persist(); toast(d.name + (editId ? ' saved.' : ' added as ' + d.id + '.'));
    go(mode === 'new' ? '#customers/new' : '#customers');
  },
  qtAddLine() { readQuote(); qDoc.lines.push(qtBlankLine()); renderQuote(`[data-i="${qDoc.lines.length - 1}"] [data-l="svc"]`); },
  qtAddCat() { readQuote(); const have = new Set(qDoc.lines.map(l => l.svc));
    qDoc.lines = qDoc.lines.filter(l => l.svc || l.item);
    M.services.filter(s => (!qDoc.qtCat || s.cat === qDoc.qtCat) && !have.has(s.code)).forEach(s => { const cr = ctrRate(qDoc.client, s.code); qDoc.lines.push({ ...qtBlankLine(), svc: s.code, item: s.name, unit: s.unit, rate: cr ? cr.rate : s.rate }); });
    if (!qDoc.lines.length) qDoc.lines.push(qtBlankLine()); renderQuote(); },
  qtDelLine(i) { readQuote(); qDoc.lines.splice(+i, 1); if (!qDoc.lines.length) qDoc.lines.push(qtBlankLine()); renderQuote(); },
  qtSave(mode) {
    const d = readQuote();
    try { qtValidate(d, mode === 'final'); } catch (e) { return formErr('#sdErr', e); }
    if (mode === 'final') d.status = 'Sent';
    const isNew = !d.id;
    if (isNew) { d.id = qtNo(d.loc); DB.seq.QT[d.loc] = (DB.seq.QT[d.loc] || 1) + 1; DB.quotes.push(JSON.parse(JSON.stringify(d))); }
    else DB.quotes[DB.quotes.findIndex(x => x.id === d.id)] = JSON.parse(JSON.stringify(d));
    persist(); toast(d.id + (mode === 'final' ? ' saved and marked as sent.' : ' saved.')); go('#quotes');
  },
  qtMark(st) { const d = readQuote(); d.status = st; DB.quotes[DB.quotes.findIndex(x => x.id === d.id)] = JSON.parse(JSON.stringify(d)); persist(); toast(d.id + ' marked as ' + st.toLowerCase() + '.'); renderQuote(); },
  qtDelete() { DB.quotes = DB.quotes.filter(x => x.id !== qDoc.id); persist(); toast(qDoc.id + ' deleted.'); go('#quotes'); },
  ctrAddLine() { readContract(); kDoc.lines.push({ code: '', unit: '', rate: '', minFee: 0 }); renderContract(); const s = $(`[data-i="${kDoc.lines.length - 1}"] [data-l="code"]`); if (s) s.focus(); },
  ctrAddAll() { readContract(); const have = new Set(kDoc.lines.map(l => l.code)); kDoc.lines = kDoc.lines.filter(l => l.code);
    M.services.filter(s => !have.has(s.code)).forEach(s => kDoc.lines.push({ code: s.code, name: s.name, cat: s.cat, unit: s.unit, rate: s.rate, minFee: 0 })); renderContract(); },
  ctrDelLine(i) { readContract(); kDoc.lines.splice(+i, 1); renderContract(); },
  ctrDelete() { DB.contracts = DB.contracts.filter(x => x.id !== kDoc.id); persist(); toast(kDoc.id + ' deleted.'); go('#contracts'); },
  ctrSave(mode) {
    const k = readContract();
    try { if (mode !== 'draft') ctrValidate(k); else if (!k.client) throw new Error('Choose the customer.'); } catch (e) { return formErr('#ctrErr', e); }
    if (mode === 'draft') k.lines = k.lines.filter(l => l.code);
    if (!k.ref || !k.ref.startsWith(ctrAgrNo(k.client, k.id).slice(0, 8)) || DB.contracts.some(x => x.id !== k.id && x.id !== k.replaces && x.ref === k.ref)) k.ref = ctrAgrNo(k.client, k.id);
    const isNew = !k.id;
    if (isNew) { k.id = 'CTR-' + String(DB.seq.CTR).padStart(5, '0'); DB.seq.CTR++; }
    k.history = [...(k.history || []), { at: iso(today), by: DATA.user.name, what: { draft: 'Saved as draft', submit: 'Submitted for approval', approve: 'Approved and activated' }[mode] }];
    if (mode === 'submit') k.status = 'Pending approval';
    if (mode === 'approve') {
      k.status = 'Active'; k.approvedBy = DATA.user.name; k.approvedAt = iso(today);
      DB.contracts.forEach(x => { if (x.id !== k.id && x.client === k.client && ctrState(x) === 'Active' && (x.id === k.replaces || !(x.end < k.start || x.start > k.end))) x.status = 'Superseded'; });
    }
    const rec = JSON.parse(JSON.stringify(k));
    if (isNew) DB.contracts.push(rec); else DB.contracts[DB.contracts.findIndex(x => x.id === k.id)] = rec;
    persist();
    toast(k.id + ({ draft: ' saved as draft.', submit: ' submitted for approval.', approve: ' approved. ' + clName(k.client) + ' is now billed at these rates.' })[mode]);
    go('#contracts');
  }
};

/* =====================================================================

   One order carries every stage. Allocation reserves LPNs (FEFO / FIFO); pick confirmation

   goods issue (stock leaves inventory) and raises the delivery note. Delivery confirmation (POD)

function obAllocate(o) {

      .sort((a, b) => rule === 'FIFO' ? String(a.received).localeCompare(b.received) : (String(a.expiry || '9999').localeCompare(b.expiry || '9999') || String(a.received).localeCompare(b.received)));
    for (const s of pool) { if (need <= 0) break; const q = Math.min(need, s.qty - (s.alloc || 0)); s.alloc = (s.alloc || 0) + q; l.picks.push({ lpn: s.lpn, bin: s.bin, batch: s.batch, expiry: s.expiry, qty: q }); need -= q; }

  o.status = 'Allocated';
}

  o.lines.forEach(l => l.picks = (l.picks || []).filter(p => p.qty > 0)); P.confirmed = new Date().toISOString(); P.by = DATA.user.name; o.status = 'Picking';
}

    const skus = Object.entries(M.stock[w.id] || {}).filter(([, q]) => q > 0), n = slots.length, m = skus.length; let at = 0;
    skus.forEach(([sku, qty], i) => { const it = item(sku), c = Math.max(1, Math.floor(n / m) + (i < n % m ? 1 : 0)), base = Math.floor(qty / c);

function showPage(page, mode, id) {

  if (page === 'order-new') { history.replaceState(null, '', '#oborders/new'); return obShow('oborders', 'new'); }
  if (['outbound', 'oborders', 'alloc', 'pick', 'loading', 'dispatch', 'obhistory'].includes(page)) return obShow(page, mode, id);
  if (INV_PAGES.includes(page)) return invShow(page, mode, id);
  if (['returns', 'rmareq', 'rmarecv', 'rmaclose', 'rma'].includes(page)) return rmaShow(page, mode, id);
  if (page === 'inventory') { history.replaceState(null, '', '#stock'); return invShow('stock'); }
  if (page === 'customers') { CUR = { mod: 'clients', sub: page };
    if (mode === 'new') return customerForm('');
    if (mode === 'edit') return client(id).id ? customerForm(id) : head2('Customers', 'Customer not found', '<a class="btn" href="#customers">← Customers</a>') + '<div class="card empty">This customer no longer exists.</div>';
    return customersPage(); }
  if (page === 'quotes') { CUR = { mod: 'clients', sub: page };
    if (mode === 'new' || mode === 'edit') {
      const ex = DB.quotes.find(x => x.id === id);
      if (mode === 'edit' && !ex) return head2('Service quotations', 'Quotation not found', '<a class="btn" href="#quotes">← Service quotations</a>') + '<div class="card empty">This quotation no longer exists.</div>';
      const cl = custOpts()[0];
      if (!ex && !cl) return head2('Service quotations', 'New service quotation', '<a class="btn" href="#customers/new">+ New customer</a>') + '<div class="card empty">Add an active customer first.</div>';
      qDoc = ex ? JSON.parse(JSON.stringify(ex)) : quoteBlank(cl[0], client(cl[0]));
      setTimeout(qtRecalc, 0); return quoteForm(qDoc);
    }
    return quotesPage(); }
  if (page === 'contracts') { CUR = { mod: 'clients', sub: page };
    if (mode === 'new' || mode === 'edit') {
      const ex = mode === 'edit' && DB.contracts.find(x => x.id === id);
      if (mode === 'edit' && !ex) return head2('Contracts', 'Contract not found', '<a class="btn" href="#contracts">← Contracts</a>') + '<div class="card empty">This contract no longer exists.</div>';
      kRO = false;
      if (ex) {
        const st = ctrState(ex);
        if (st === 'Active') kDoc = { ...JSON.parse(JSON.stringify(ex)), id: '', version: (ex.version || 1) + 1, replaces: ex.id, status: 'Draft', start: ex.start, history: [] };
        else { kDoc = JSON.parse(JSON.stringify(ex)); kRO = !['Draft', 'Pending approval'].includes(st); }
      } else {
        const q = id && DB.quotes.find(x => x.id === id);
        const qLines = q ? q.lines.filter(l => l.svc).map(l => { const s = svcBy(l.svc); return { code: l.svc, name: s.name, cat: s.cat, unit: l.unit || s.unit, rate: +l.rate || 0, minFee: 0 }; }) : [];
        const live = q && ctrActive(q.client);
        if (live) {   // customer already has an active contract: the quotation revises it
          const keep = live.lines.filter(l => !qLines.some(x => x.code === l.code));
          kDoc = { ...JSON.parse(JSON.stringify(live)), id: '', version: (live.version || 1) + 1, replaces: live.id, status: 'Draft', quote: q.id, history: [], lines: [...keep, ...qLines] };
        } else kDoc = q ? ctrBlank(q.client, client(q.client), { quote: q.id, lines: qLines }) : ctrBlank('');

    return itemsPage(); }
  if (page === 'materials') { CUR = { mod: 'items', sub: page };
    if (mode === 'new') return materialForm('');
    if (mode === 'edit') return matBy(id).code ? materialForm(id) : head2('VAS Materials', 'Material not found', '<a class="btn" href="#materials">← VAS Materials</a>') + '<div class="card empty">This material no longer exists.</div>';
    return materialsPage(); }
