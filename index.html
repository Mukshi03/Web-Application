<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Gray Lane 3PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main menu">
    <div class="brand"><div class="logo">GL</div><div><b>Gray Lane ERP</b><span id="companyName"></span></div></div>
    <nav id="navBox" aria-label="Modules"></nav>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search SKU, LPN, ASN, order, invoice, customer" autocomplete="off" aria-label="Search"></label>
      <div class="user" id="userBox"></div>
    </header>

    <main class="wrap" id="view"></main>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/customers.js"></script>
<script src="js/items.js"></script>
<script src="js/warehouse.js"></script>
<script src="js/inbound.js"></script>
<script src="js/outbound.js"></script>
<script src="js/inventory.js"></script>
<script src="js/returns.js"></script>
<script src="js/vas.js"></script>
<script src="js/billing.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
